server:
  http_listen_port: 9080
  grpc_listen_port: 9081

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: stockquant
    static_configs:
      - targets:
          - localhost
        labels:
          job: stockquant
          __path__: /var/log/stockquant/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*?(?P<level>(INFO|WARNING|ERROR|DEBUG)).*?(?P<message>.*)$'
      - labels:
          level:
          message:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
          location: Asia/Shanghai
