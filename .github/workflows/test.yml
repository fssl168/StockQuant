name: StockQuant CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Import check
        run: python -c "import stockquant.api.main; print('Backend import OK')"

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/test_nfr_performance.py \
            --ignore=tests/test_nfr_ai_reliability.py \
            --ignore=tests/test_nfr_reliability.py \
            --cov=stockquant \
            --cov-report=xml \
            --cov-report=term-missing \
            -v --tb=short

      - name: Check coverage threshold
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib['line-rate'])
          print(f'Coverage: {rate:.1%}')
          assert rate >= 0.6, f'覆盖率 {rate:.1%} 低于阈值 60%'
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

  nfr-gate:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run NFR performance tests (hard gate)
        run: |
          pytest tests/test_nfr_performance.py -v --tb=short --maxfail=1

      - name: Run NFR reliability tests (hard gate)
        run: |
          pytest tests/test_nfr_reliability.py -v --tb=short --maxfail=1

      - name: Run NFR AI reliability tests (allow skip for missing API keys)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pytest tests/test_nfr_ai_reliability.py -v --tb=short

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build check
        working-directory: web
        run: npm run build
