global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    option  redispatch
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# PostgreSQL 读写分离
# 写操作走主库，读操作负载均衡到从库

listen postgres-write
    bind *:5432
    mode tcp
    balance roundrobin
    option pgsql-check user replicator
    server primary postgres-primary:5432 check inter 10s rise 2 fall 3

listen postgres-read
    bind *:5433
    mode tcp
    balance roundrobin
    option pgsql-check user replicator
    server replica postgres-replica:5432 check inter 10s rise 2 fall 3

# Stats 页面
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats auth admin:stockquant2026
