groups:
  - name: stockquant_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: BackendDown
        expr: up{job="stockquant-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend service is down"

      - alert: HighBacktestTasks
        expr: backtest_tasks_running > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Many backtest tasks running"

      - alert: RiskEventsSpike
        expr: rate(risk_events_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Risk events spike detected"

      - alert: WebSocketConnectionsHigh
        expr: websocket_connections > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High WebSocket connections"
